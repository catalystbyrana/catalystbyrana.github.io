</style><style>/* Layout: Catalyst app shell. Sticky brand bar, one view at a time (course home → lesson → practice), single 740px column. */
:root{
  --bg:#fbf6ee; --paper:#ffffff; --ink:#1b2a4e; --soft:#5d6880; --line:#e9e1d3; --wash:#f4ede1;
  --coral:#e0573a; --coral-w:#fdeee9; --teal:#0f8486; --teal-w:#e3f3f2; --gold:#c4860a; --gold-w:#fcf2dc;
  --plum:#7a4fa8; --plum-w:#f1eaf8; --navy:#1b2a4e; --navy-w:#e8ebf3;
  --ok:#2f8f5b; --ok-w:#e6f4ec; --bad:#c43d32; --bad-w:#fcebe9;
  --grid:#e9e1d3; --axis:#5d6880; --curve:#e0573a; --curve2:#0f8486;
  --display:"Gloock", Georgia, "Times New Roman", serif; --script:"Instrument Serif", Georgia, serif;
  --ui:"Outfit","Segoe UI",system-ui,sans-serif; --body:"Cairo","Segoe UI",system-ui,sans-serif; --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1628; --paper:#18213a; --ink:#f4eee3; --soft:#a8b1c6; --line:#2a3553; --wash:#141d33;
  --coral:#f27c5f; --coral-w:#3a2430; --teal:#4cc2c0; --teal-w:#16343a; --gold:#e9b44a; --gold-w:#352c19;
  --plum:#b590e0; --plum-w:#2b2340; --navy:#9fb2e6; --navy-w:#1f2a49;
  --ok:#5fc68d; --ok-w:#173528; --bad:#f2786c; --bad-w:#3b2025;
  --grid:#2a3553; --axis:#a8b1c6; --curve:#f27c5f; --curve2:#4cc2c0; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1628; --paper:#18213a; --ink:#f4eee3; --soft:#a8b1c6; --line:#2a3553; --wash:#141d33;
  --coral:#f27c5f; --coral-w:#3a2430; --teal:#4cc2c0; --teal-w:#16343a; --gold:#e9b44a; --gold-w:#352c19;
  --plum:#b590e0; --plum-w:#2b2340; --navy:#9fb2e6; --navy-w:#1f2a49;
  --ok:#5fc68d; --ok-w:#173528; --bad:#f2786c; --bad-w:#3b2025;
  --grid:#2a3553; --axis:#a8b1c6; --curve:#f27c5f; --curve2:#4cc2c0; color-scheme:dark }
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
.wrap{max-width:740px;margin:0 auto;padding-block:0 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ar{display:block;direction:rtl;text-align:right;color:var(--soft);font-size:.92em;line-height:1.55}
body.noar .ar{display:none}
.m{font-family:var(--ui);font-weight:600;white-space:nowrap}
.m sup{font-size:.68em;line-height:0}
.m sub{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.sq{white-space:nowrap}.sq>span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
.c-navy{--c:var(--navy);--cw:var(--navy-w)} .c-teal{--c:var(--teal);--cw:var(--teal-w)} .c-coral{--c:var(--coral);--cw:var(--coral-w)} .c-gold{--c:var(--gold);--cw:var(--gold-w)} .c-plum{--c:var(--plum);--cw:var(--plum-w)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:740px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;flex:none}
.back[hidden]{display:none}
.logo{font-family:var(--display);font-size:24px;line-height:1;white-space:nowrap;text-decoration:none}.logo i{font-style:normal;color:var(--coral)}
.logo small{font-family:var(--script);font-style:italic;color:var(--coral);font-size:16px;margin-left:5px}
@media (max-width:400px){.logo small{display:none}}
.sp{flex:1}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font:600 13px var(--ui);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill[hidden]{display:none}

/* course home */
.chero{margin-top:16px;border-radius:26px;background:#1b2a4e;color:#fbf6ee;padding:24px 20px;position:relative;overflow:hidden}
.chero:after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(224,87,58,.32)}
.chero>*{position:relative;z-index:1}
.chero .code{font:600 12px var(--ui);letter-spacing:2.2px;text-transform:uppercase;opacity:.75}
.chero h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,12vw,64px);line-height:.98;margin:10px 0 8px}
.chero h1 i{font-style:normal;color:#f27c5f}
.chero .tag{font:500 13px var(--ui);letter-spacing:3px;text-transform:uppercase;color:#f27c5f}
.chero p{margin:6px 0 0;opacity:.85;max-width:46ch}
.chero .art{position:absolute;right:16px;bottom:16px;width:150px;opacity:.95}
.chero .art svg{width:100%;height:auto;display:block}
.cstats{display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(251,246,238,.2);flex-wrap:wrap;max-width:62%}
.cstats div{font:500 13px var(--ui);opacity:.85}.cstats b{display:block;font-family:var(--display);font-weight:400;font-size:28px}
@media (max-width:480px){.chero .art{width:96px;opacity:.6}.cstats{max-width:100%}}
.homebtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.hb{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:14px;text-decoration:none;min-width:0}
.hb .ic{width:40px;height:40px;border-radius:12px;background:var(--cw);color:var(--c);display:flex;align-items:center;justify-content:center;flex:none;font:700 15px var(--ui)}
.hb b{display:block;font:600 16px var(--ui);line-height:1.2}

<script>/* ===== Catalyst Math core: math formatting, helpers, generators toolkit, views ===== */
(function(){
"use strict";
const W = window;
/* ---------- math formatter ----------
   Inside $...$ : ^x  ^12  ^-3  ^{...}  _x  \frac{a}{b}  \sqrt{x}  * → ·  - → −  +- → ±
*/
function M(s){
  let i=0;
  function group(){ // parse {...} or single token
    if(s[i]==='{'){ let d=1,j=i+1; while(j<s.length&&d){ if(s[j]==='{')d++; else if(s[j]==='}')d--; j++; } const inner=s.slice(i+1,j-1); i=j; return M(inner); }
    let m=s.slice(i).match(/^(-?\d+(\.\d+)?|[a-zA-Z]|\(.*?\))/); if(!m) return '';
    i+=m[0].length; return M(m[0]);
  }
  let out='';
  while(i<s.length){
    const c=s[i];
    if(s.startsWith('\\frac',i)){ i+=5; const a=group(), b=group(); out+='<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>'; continue; }
    if(s.startsWith('\\sqrt',i)){ i+=5; const a=group(); out+='<span class="sq">√<span>'+a+'</span></span>'; continue; }
    if(c==='\\'){ if(s[i+1]==='{'||s[i+1]==='}'){out+=s[i+1];i+=2;continue;} const mm=s.slice(i).match(/^\\(div|neq|cdot|times|pm|le|ge|approx|infty|emptyset)/); if(mm){out+={div:'÷',neq:'≠',cdot:'·',times:'×',pm:'±',le:'≤',ge:'≥',approx:'≈',infty:'∞',emptyset:'∅'}[mm[1]];i+=mm[0].length;continue;} }
    if(s.startsWith('+-',i)){ out+='±'; i+=2; continue; }
    if(s.startsWith('<=',i)){ out+='≤'; i+=2; continue; }
    if(s.startsWith('>=',i)){ out+='≥'; i+=2; continue; }
    if(s.startsWith('!=',i)){ out+='≠'; i+=2; continue; }
    if(c==='^'){ i++; out+='<sup>'+group()+'</sup>'; continue; }
    if(c==='_'){ i++; out+='<sub>'+group()+'</sub>'; continue; }
    if(c==='-'){ out+='−'; i++; continue; }
    if(c==='*'){ out+='·'; i++; continue; }
    if(c==='<'){ out+='&lt;'; i++; continue; }
    if(c==='>'){ out+='&gt;'; i++; continue; }
    if(c==='&'){ out+='&amp;'; i++; continue; }
    out+=c; i++;
  }
  return out;
}
function T(s){ // text with $math$
  if(s==null) return '';
  return String(s).split('$').map((p,k)=>k%2?'<span class="m">'+M(p)+'</span>':p).join('');
}
W.CM={M,T};

/* ---------- small helpers ---------- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let v=0;while(v===0)v=rnd(a,b);return v;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};

/* polynomial in one variable: array of coefficients, index = power */
const P={
  norm(p){p=p.slice();while(p.length>1&&p[p.length-1]===0)p.pop();return p;},
  add(a,b){const r=[];for(let i=0;i<Math.max(a.length,b.length);i++)r[i]=(a[i]||0)+(b[i]||0);return P.norm(r);},
  neg(a){return a.map(x=>-x);},
  sub(a,b){return P.add(a,P.neg(b));},
  mul(a,b){const r=new Array(a.length+b.length-1).fill(0);a.forEach((x,i)=>b.forEach((y,j)=>{r[i+j]+=x*y;}));return P.norm(r);},
  str(p,v){v=v||'x';const parts=[];for(let i=p.length-1;i>=0;i--){const c=p[i];if(!c)continue;let t='';const ac=Math.abs(c);
      if(i===0)t=String(ac);else t=(ac===1?'':ac)+v+(i>1?'^'+i:'');
      parts.push((c<0?'-':'+')+t);}
    if(!parts.length)return '0';
    let s=parts.join(' ').replace(/([+-])/g,' $1 ').trim();
    s=s.replace(/^\+ /,'').replace(/^- /,'-');return s.replace(/\s+/g,' ');}
};
/* binomial (a v + b) as string */
const lin=(a,b,v)=>P.str([b,a],v||'x');
W.CG={rnd,nz,pick,shuffle,gcd,P,lin};

/* build MCQ from correct + distractor strings (unique), shuffled */
function mcq(q,correct,ds,sol,extra){
  const seen=new Set([correct]);const opts=[correct];
  for(const d of ds){ if(opts.length>=4)break; if(!seen.has(d)){seen.add(d);opts.push(d);} }
  // fallback distractors: nudge the last number in the correct answer
  let k=1;
  while(opts.length<4&&k<12){
    let m=null; const re=/\d+/g; let mm; while((mm=re.exec(correct))){const pc=correct[mm.index-1]; if(pc!=='^'&&pc!=='{'&&pc!=='t')m={index:mm.index,1:mm[0]};}
    let f;
    if(m){const n=parseInt(m[1],10);const nn=n+(k%2?k:-k);if(nn>=0)f=correct.slice(0,m.index)+nn+correct.slice(m.index+m[1].length);}
    else f=correct.replace(/\$$/,' + '+k+'$');
    if(f&&!seen.has(f)){seen.add(f);opts.push(f);}
    k++;
  }
  const o=shuffle(opts);
  return Object.assign({kind:'mcq',q,o,a:[o.indexOf(correct)],sol},extra||{});
}
W.CG.mcq=mcq;

/* ---------- graph (SVG) ----------
   opts: {fns:[{f, color}], pts:[[x,y,label]], xr:[-6,6], yr:[-6,6], size}
*/
function graph(o){
  const xr=o.xr||[-6,6], yr=o.yr||[-6,6], S=o.size||300;
  const w=S,h=o.h||Math.max(S*0.6,Math.min(S*1.25,S*(yr[1]-yr[0])/(xr[1]-xr[0])));
  const X=x=>(x-xr[0])/(xr[1]-xr[0])*w, Y=y=>h-(y-yr[0])/(yr[1]-yr[0])*h;
  let g='';
  const sx=o.step||1, sy=o.ystep||sx;
  for(let x=Math.ceil(xr[0]/sx)*sx;x<=xr[1];x+=sx)g+='<line x1="'+X(x)+'" y1="0" x2="'+X(x)+'" y2="'+h+'" stroke="var(--grid)" stroke-width="1"/>';
  for(let y=Math.ceil(yr[0]/sy)*sy;y<=yr[1];y+=sy)g+='<line x1="0" y1="'+Y(y)+'" x2="'+w+'" y2="'+Y(y)+'" stroke="var(--grid)" stroke-width="1"/>';
  if(xr[0]<=0&&xr[1]>=0)g+='<line x1="'+X(0)+'" y1="0" x2="'+X(0)+'" y2="'+h+'" stroke="var(--axis)" stroke-width="1.6"/>';
  if(yr[0]<=0&&yr[1]>=0)g+='<line x1="0" y1="'+Y(0)+'" x2="'+w+'" y2="'+Y(0)+'" stroke="var(--axis)" stroke-width="1.6"/>';
  // axis labels every 2*step
  const lab=o.label!==false;
  if(lab){
    for(let x=Math.ceil(xr[0]/sx)*sx;x<=xr[1];x+=sx){ if(x===0||Math.round(x/sx)%2)continue; g+='<text x="'+X(x)+'" y="'+Math.min(h-3,Y(0)+13)+'" font-size="10" text-anchor="middle" fill="var(--axis)" font-family="Outfit,sans-serif">'+x+'</text>'; }
    for(let y=Math.ceil(yr[0]/sy)*sy;y<=yr[1];y+=sy){ if(y===0||Math.round(y/sy)%2)continue; g+='<text x="'+Math.max(3,X(0)-4)+'" y="'+(Y(y)+3)+'" font-size="10" text-anchor="end" fill="var(--axis)" font-family="Outfit,sans-serif">'+y+'</text>'; }
  }
  (o.fns||[]).forEach(fn=>{
    let d='',pen=false;
    for(let k=0;k<=400;k++){const x=xr[0]+(xr[1]-xr[0])*k/400, y=fn.f(x);
      if(!isFinite(y)||y<yr[0]-5||y>yr[1]+5){pen=false;continue;}
      d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);pen=true;}
    g+='<path d="'+d+'" fill="none" stroke="'+(fn.color||'var(--curve)')+'" stroke-width="2.6" stroke-linecap="round"'+(fn.dash?' stroke-dasharray="6 5"':'')+'/>';
  });
  (o.pts||[]).forEach(p=>{g+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="4.5" fill="'+(p[3]||'var(--ink)')+'" stroke="var(--paper)" stroke-width="1.5"/>';
    if(p[2])g+='<text x="'+(X(p[0])+7)+'" y="'+(Y(p[1])-7)+'" font-size="11" font-weight="600" fill="var(--ink)" font-family="Outfit,sans-serif">'+p[2]+'</text>';});
  return '<svg viewBox="-2 -2 '+(w+4)+' '+(h+4)+'" role="img" aria-label="'+(o.alt||'graph')+'">'+'<rect x="0" y="0" width="'+w+'" height="'+h+'" fill="var(--paper)"/>'+g+'</svg>';
}
W.CG.graph=graph;
})();

window.LESSONS={}; window.GEN={};
window.COURSE={
  art:'<svg viewBox="0 0 160 150"><path d="M10 130 H150" stroke="#fbf6ee" stroke-width="2" opacity=".5"/><path d="M30 10 V140" stroke="#fbf6ee" stroke-width="2" opacity=".5"/><path d="M22 122 L146 26" fill="none" stroke="#e0573a" stroke-width="5" stroke-linecap="round"/><circle cx="58" cy="94" r="6" fill="#0f8486"/><circle cx="110" cy="54" r="6" fill="#0f8486"/><path d="M58 94 H110 V54" fill="none" stroke="#d4920f" stroke-width="2.5" stroke-dasharray="5 4"/><text x="66" y="40" font-family="Gloock,Georgia,serif" font-size="22" fill="#fbf6ee">y = mx + b</text></svg>',

    {n:3,mod:'Module 4',title:'Linear and Nonlinear Functions',ar:'الدوال الخطية وغير الخطية',test:true,lessons:['l12','l13','l14','l15','l16','l17','l18']}
  ]
};
window.PLAN={l1:['1-1','Numerical Expressions','p.3'],l2:['1-2','Algebraic Expressions','p.13'],l3:['1-3','Properties of Real Numbers','p.23'],l4:['1-4','Distributive Property','p.35'],
l5:['2-1','Writing and Interpreting Equations','p.65'],l6:['2-2','Solving One-Step Equations','p.75'],l7:['2-3','Solving Multi-Step Equations','p.85'],l8:['2-4','Solving Equations with the Variable on Each Side','p.91'],l9:['2-5','Solving Equations Involving Absolute Value','p.101'],l10:['2-6','Solving Proportions','p.109'],l11:['2-7','Using Formulas','p.117'],
l12:['4-1','Graphing Linear Functions','p.209'],l13:['4-2','Rate of Change and Slope','p.219'],l14:['4-3','Slope-Intercept Form','p.229'],l15:['4-4','Transformations of Linear Functions','p.239'],l16:['4-5','Arithmetic Sequences','p.251'],l17:['4-6','Piecewise and Step Functions','p.259'],l18:['4-7','Absolute Value Functions','p.267']};
/* Module 1 · Lesson 1-1 · Numerical Expressions (book p.3) */
(function(){
const {rnd,nz,pick,shuffle,mcq}=window.CG, GEN=window.GEN;
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
const W=n=>n<20?ONES[n]:n<100?TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''):String(n);
window.CW=W;
/* evaluate a plain expression string with + - * / ^ ( ) */
const ev=s=>Function('"use strict";return ('+s.replace(/\^/g,'**')+')')();
window.CEV=ev;

/* Type 1 · translate a verbal expression */
GEN.l1_tr=()=>{
  const a=rnd(2,15), b=rnd(2,15), c=rnd(2,9);
  const t=rnd(0,4); let q,ok,ds,sol;
  if(t===0){q=W(a)+' plus '+W(b)+' divided by '+W(c);ok='$'+a+' + '+b+' \\div '+c+'$';ds=['$('+a+' + '+b+') \\div '+c+'$','$'+a+' \\div '+b+' + '+c+'$','$'+c+' \\div ('+a+' + '+b+')$'];sol=['"plus" → +, "divided by" → ÷.','No "sum of", so no brackets: $'+a+' + '+b+' \\div '+c+'$.'];}
  else if(t===1){q='the sum of '+W(a)+' and '+W(b)+' divided by '+W(c);ok='$\\frac{'+a+' + '+b+'}{'+c+'}$';ds=['$'+a+' + \\frac{'+b+'}{'+c+'}$','$\\frac{'+c+'}{'+a+' + '+b+'}$','$'+a+' + '+b+' + '+c+'$'];sol=['"the sum of '+W(a)+' and '+W(b)+'" is one group: $('+a+' + '+b+')$.','Divide the whole group by '+c+'.'];}
  else if(t===2){const big=a+b+20;q=W(a)+' less than '+W(big);ok='$'+big+' - '+a+'$';ds=['$'+a+' - '+big+'$','$'+a+' + '+big+'$','$'+big+' \\div '+a+'$'];sol=['"'+W(a)+' less than '+W(big)+'" means start with '+big+' and take away '+a+'.','The order flips: $'+big+' - '+a+'$.'];}
  else if(t===3){q=W(a)+' more than '+W(c)+' times '+W(b);ok='$'+c+' * '+b+' + '+a+'$';ds=['$('+a+' + '+c+') * '+b+'$','$'+a+' * '+c+' + '+b+'$','$'+a+' + '+c+' + '+b+'$'];sol=['"'+W(c)+' times '+W(b)+'" → $'+c+' * '+b+'$.','"'+W(a)+' more than" → add '+a+'.'];}
  else {const big=a+b+10;q='the difference of '+W(big)+' and '+W(a)+' divided by the product of '+W(c)+' and '+W(b);ok='$\\frac{'+big+' - '+a+'}{'+c+' * '+b+'}$';ds=['$'+big+' - \\frac{'+a+'}{'+c+' * '+b+'}$','$\\frac{'+big+' - '+a+'}{'+c+' + '+b+'}$','$\\frac{'+a+' - '+big+'}{'+c+' * '+b+'}$'];sol=['"difference of '+W(big)+' and '+W(a)+'" → $('+big+' - '+a+')$ on top.','"product of '+W(c)+' and '+W(b)+'" → $'+c+' * '+b+'$ on the bottom.'];}
  const m=mcq('Write a numerical expression for: <i>'+q+'</i>.',ok,ds,sol); m.ar='اكتب التعبير العددي.'; return m;
};

/* Type 2 · write an expression for a real-world rule */
GEN.l1_rule=()=>{
  const t=rnd(0,1);
  if(t===0){const A=pick([200,220,210]), x=rnd(120,190), k=pick([2,3,4]), d=pick([3,5]);
    const ok='$\\frac{'+k+'('+A+' - '+x+')}{'+d+'}$';
    const m=mcq('A score is found by subtracting a player\'s average from '+A+', multiplying by '+k+', and dividing by '+d+'. The average is '+x+'. Which expression gives the score?',ok,['$\\frac{'+k+' * '+A+' - '+x+'}{'+d+'}$','$'+k+'('+A+' - '+x+' \\div '+d+')$','$\\frac{'+k+'('+x+' - '+A+')}{'+d+'}$'],['First step: $'+A+' - '+x+'$ (keep it in brackets).','Multiply the difference by '+k+', then divide all of it by '+d+'.']);
    m.ar='اتّبع الخطوات بالترتيب، والفرق بين قوسين.';return m;}
  const C=rnd(20,40);const ok='$\\frac{'+C+' * 9}{5} + 32$';
  const m=mcq('To change °C to °F: multiply by 9, divide by 5, and add 32. Which expression changes '+C+'°C to °F?',ok,['$\\frac{'+C+' * 9}{5 + 32}$','$\\frac{'+C+' * 5}{9} + 32$','$\\frac{'+C+' * 9}{5} * 32$'],['Multiply then divide: $\\frac{'+C+' * 9}{5}$.','Add 32 at the end, outside the fraction.']);
  m.ar='اضرب في 9، اقسم على 5، وبعدين زوّد 32.';return m;
};

/* Type 3 · powers */
GEN.l1_pow=()=>{
  let b,e; do{b=rnd(2,9);e=rnd(2,5);}while(Math.pow(b,e)>5000);
  if(Math.random()<.3){const m=mcq('In $'+b+'^'+e+'$, which number is the base?','$'+b+'$',['$'+e+'$','$'+Math.pow(b,e)+'$','$'+(b*e)+'$'],['The base is the number multiplied by itself: '+b+'.','The exponent '+e+' says how many times.']);m.ar='الأساس هو العدد اللي بيتضرب في نفسه.';return m;}
  return {kind:'num',q:'Evaluate $'+b+'^'+e+'$.',ar:'أوجد القيمة.',ans:String(Math.pow(b,e)),sol:['$'+b+'^'+e+'$ = '+Array(e).fill(b).join(' · ')+' ('+b+' used '+e+' times).','= '+Math.pow(b,e)+'. Not $'+b+' * '+e+' = '+(b*e)+'$.']};
};

/* Type 4 · order of operations */
GEN.l1_ord=()=>{
  const t=rnd(0,3); let s,show;
  if(t===0){const a=rnd(10,30),b=rnd(2,9),c=rnd(2,8),d=rnd(2,9),e=rnd(2,9);s=a+'-'+b+'+'+c+'^2-'+d+'*'+e;show=a+' - '+b+' + '+c+'^2 - '+d+' * '+e;}
  else if(t===1){const b=rnd(2,9),k=rnd(2,9),c=rnd(2,9),d=rnd(2,9);s=(b*k)+'/'+b+'+'+c+'*'+d;show=(b*k)+' \\div '+b+' + '+c+' * '+d;}
  else if(t===2){const a=rnd(2,20),b=rnd(2,6),d=rnd(1,8),c=d+rnd(1,6);s=a+'+'+b+'*('+c+'-'+d+')';show=a+' + '+b+'('+c+' - '+d+')';}
  else {const a=rnd(40,90),b=rnd(2,4),c=rnd(2,3),d=rnd(1,15);s=a+'-'+b+'^2*'+c+'+'+d;show=a+' - '+b+'^2 * '+c+' + '+d;}
  const v=ev(s);
  return {kind:'num',q:'Evaluate $'+show+'$.',ar:'استخدم ترتيب العمليات.',ans:String(v),sol:['Brackets first, then powers.','Then × and ÷ from left to right.','Then + and − from left to right → '+v+'.']};
};

/* Type 5 · grouping symbols and fraction bars */
GEN.l1_grp=()=>{
  if(Math.random()<.5){
    let a,b,c,d,e,top,bot; let n=0;
    do{a=rnd(1,8);b=rnd(1,8);c=rnd(2,5);e=rnd(1,6);d=e+rnd(1,5);top=(a+b)*(a+b);bot=c*(d-e);n++;}while(top%bot!==0&&n<200);
    if(top%bot!==0){a=4;b=5;c=3;d=7;e=4;top=81;bot=9;}
    return {kind:'num',q:'Evaluate $\\frac{('+a+' + '+b+')^2}{'+c+'('+d+' - '+e+')}$.',ar:'احسب البسط والمقام كل واحد لوحده الأول.',ans:String(top/bot),sol:['Top: $('+(a+b)+')^2 = '+top+'$.','Bottom: $'+c+'('+(d-e)+') = '+bot+'$.','$'+top+' \\div '+bot+' = '+(top/bot)+'$.']};
  }
  const a=rnd(20,40),b=rnd(5,12),d=rnd(1,4),c=d+rnd(1,3),e=rnd(1,9);
  const v=a-(b+(c-d)*(c-d))+e;
  return {kind:'num',q:'Evaluate $'+a+' - ['+b+' + ('+c+' - '+d+')^2] + '+e+'$.',ar:'ابدأ من القوس اللي جوه خالص.',ans:String(v),sol:['Innermost first: $('+c+' - '+d+')^2 = '+((c-d)*(c-d))+'$.','Square brackets: $['+b+' + '+((c-d)*(c-d))+'] = '+(b+(c-d)*(c-d))+'$.','$'+a+' - '+(b+(c-d)*(c-d))+' + '+e+' = '+v+'$.']};
};

/* Type 6 · write and evaluate (real world) */
GEN.l1_rw=()=>{
  const t=rnd(0,2);
  if(t===0){const f=pick([30,40,50,60]),r=pick([15,20,25,30]),h1=rnd(1,4),h2=rnd(1,4);
    if(Math.random()<.5){const ok='$'+f+' + '+r+'('+h1+' + '+h2+')$';const m=mcq('A plumber charges a flat fee of AED '+f+' plus AED '+r+' per hour. He works '+h1+' hours on Monday and '+h2+' hours on Tuesday. Which expression gives the bill?',ok,['$'+r+'('+h1+' + '+h2+')$','$'+r+' + '+f+'('+h1+' + '+h2+')$','$('+f+' + '+r+')('+h1+' + '+h2+')$'],['The flat fee is paid once: '+f+'.','The hourly rate is paid for all the hours: $'+r+'('+h1+' + '+h2+')$.']);m.ar='الرسوم الثابتة مرة واحدة بس.';return m;}
    const v=f+r*(h1+h2);
    return {kind:'num',q:'A plumber charges a flat fee of AED '+f+' plus AED '+r+' per hour. He works '+h1+' hours on Monday and '+h2+' hours on Tuesday. How much is the bill in AED?',ar:'اكتب التعبير وبعدين احسبه.',ans:String(v),sol:['$'+f+' + '+r+'('+h1+' + '+h2+')$','$= '+f+' + '+r+'('+(h1+h2)+') = '+f+' + '+(r*(h1+h2))+' = '+v+'$']};}
  if(t===1){const p=[rnd(2,5)*5,rnd(2,5)*10,rnd(5,10)*5],n=[rnd(1,4),rnd(1,4),rnd(1,4)];const v=n[0]*p[0]+n[1]*p[1]+n[2]*p[2];
    return {kind:'num',q:'In a game you roll '+n[0]+' balls into the '+p[0]+'-point hole, '+n[1]+' into the '+p[1]+'-point hole and '+n[2]+' into the '+p[2]+'-point hole. What is the total score?',ar:'اضرب كل عدد في نقاطه واجمع.',ans:String(v),sol:['$'+n[0]+' * '+p[0]+' + '+n[1]+' * '+p[1]+' + '+n[2]+' * '+p[2]+'$','$= '+n[0]*p[0]+' + '+n[1]*p[1]+' + '+n[2]*p[2]+' = '+v+'$']};}
  const ad=rnd(2,4),ch=rnd(1,4),pa=pick([40,45,50,55]),pc=pick([20,25,30,35]);const v=ad*pa+ch*pc;
  return {kind:'num',q:'Tickets cost AED '+pa+' for an adult and AED '+pc+' for a child. A family buys '+ad+' adult and '+ch+' child tickets. What is the total cost in AED?',ar:'اكتب التعبير واحسبه.',ans:String(v),sol:['$'+ad+' * '+pa+' + '+ch+' * '+pc+'$','$= '+(ad*pa)+' + '+(ch*pc)+' = '+v+'$']};
};

/* Module 1 · Lesson 1-2 · Algebraic Expressions (book p.13) */
(function(){
const {rnd,nz,pick,shuffle,mcq,P}=window.CG, GEN=window.GEN, W=window.CW;
const PW={2:'squared',3:'cubed',4:'to the fourth power',5:'to the fifth power'};

GEN.l2_toverb=()=>{
  const v=pick(['x','m','y','n']), k=rnd(2,9), n=rnd(2,4), c=rnd(1,9), t=rnd(0,2);
  let e,ok,ds;
  if(t===0){e=k+v+'^'+n+' + '+c;ok=W(k)+' times '+v+' '+PW[n]+' plus '+W(c);ds=[W(k)+' times '+v+' plus '+W(c)+' '+PW[n],'the sum of '+W(k)+' times '+v+' and '+W(c)+', '+PW[n],W(k)+' plus '+v+' '+PW[n]+' times '+W(c)];}
  else if(t===1){e=k+'('+v+' - '+c+')';ok=W(k)+' times the difference of '+v+' and '+W(c);ds=[W(k)+' times '+v+' minus '+W(c),'the difference of '+W(k)+' times '+v+' and '+W(c),W(c)+' less than '+W(k)+' times '+v];}
  else {e='\\frac{'+v+'^'+n+'}{'+k+'}';ok=v+' '+PW[n]+' divided by '+W(k);ds=[W(k)+' divided by '+v+' '+PW[n],v+' times '+W(n)+' divided by '+W(k),'the quotient of '+W(k)+' and '+v+' '+PW[n]];}
  const m=mcq('Which verbal expression represents $'+e+'$?',ok,ds,['Read the expression in order; a bracket is "the sum / difference of…".','$'+e+'$ → '+ok+'.']);m.ar='اختار الترجمة اللفظية الصح.';return m;
};
GEN.l2_toalg=()=>{
  const v=pick(['n','k','m','d','x']), a=rnd(2,9), b=rnd(5,40), t=rnd(0,5); let q,ok,ds;
  if(t===0){q=v+' cubed increased by '+W(a);ok='$'+v+'^3 + '+a+'$';ds=['$3'+v+' + '+a+'$','$('+v+' + '+a+')^3$','$'+a+v+'^3$'];}
  else if(t===1){q=b+' decreased by '+W(a)+' times '+v;ok='$'+b+' - '+a+v+'$';ds=['$'+a+v+' - '+b+'$','$('+b+' - '+a+')'+v+'$','$'+b+' - '+v+' + '+a+'$'];}
  else if(t===2){q=W(a)+' more than twice '+v;ok='$2'+v+' + '+a+'$';ds=['$2('+v+' + '+a+')$','$'+a+v+' + 2$','$2'+v+' - '+a+'$'];}
  else if(t===3){q=b+' less than the sum of '+v+' and '+W(a);ok='$('+v+' + '+a+') - '+b+'$';ds=['$'+b+' - ('+v+' + '+a+')$','$'+v+' + '+a+' + '+b+'$','$'+v+' - '+b+' + '+a+'$'];}
  else if(t===4){q='the quotient of '+b+' and '+v;ok='$\\frac{'+b+'}{'+v+'}$';ds=['$\\frac{'+v+'}{'+b+'}$','$'+b+v+'$','$'+b+' - '+v+'$'];}
  else {q=W(a)+' times the quantity '+v+' plus '+b;ok='$'+a+'('+v+' + '+b+')$';ds=['$'+a+v+' + '+b+'$','$'+a+' + '+v+' + '+b+'$','$'+a+'('+v+') + '+a+'$'];}
  const m=mcq('Write an algebraic expression for: <i>'+q+'</i>.',ok,ds,['"times the quantity" / "the sum of" → brackets.','"less than / more than" → the number goes after: '+ok+'.']);m.ar='حوّل الكلام لتعبير جبري.';return m;
};
GEN.l2_eval=()=>{
  const t=rnd(0,3); let e,v,s,vars;
  if(t===0){const a=rnd(1,4),b=rnd(2,8),c=pick([2,3,4,6]);let k=a*a*(3*b-a+5);
    if(k%c){return GEN.l2_eval();}
    e='a^2(3b - a + 5) \\div c';vars='a = '+a+', b = '+b+', c = '+c;v=k/c;s=['$'+a+'^2(3 * '+b+' - '+a+' + 5) \\div '+c+'$','$= '+(a*a)+'('+(3*b-a+5)+') \\div '+c+' = '+k+' \\div '+c+' = '+v+'$'];}
  else if(t===1){const x=rnd(2,9),y=rnd(2,9),z=rnd(1,9);e='xy + z';vars='x = '+x+', y = '+y+', z = '+z;v=x*y+z;s=['$'+x+' * '+y+' + '+z+' = '+(x*y)+' + '+z+' = '+v+'$'];}
  else if(t===2){const x=rnd(2,9),y=rnd(2,20),z=rnd(1,9);e='2(x + z) - y';vars='x = '+x+', y = '+y+', z = '+z;v=2*(x+z)-y;s=['$2('+x+' + '+z+') - '+y+' = 2('+(x+z)+') - '+y+' = '+v+'$'];}
  else {const g=rnd(1,5),r=rnd(2,6),tt=rnd(2,9);e='t^2 + 8rt + r^2';vars='r = '+r+', t = '+tt;v=tt*tt+8*r*tt+r*r;s=['$'+tt+'^2 + 8('+r+')('+tt+') + '+r+'^2$','$= '+(tt*tt)+' + '+(8*r*tt)+' + '+(r*r)+' = '+v+'$'];}
  return {kind:'num',q:'Evaluate $'+e+'$ if $'+vars+'$.',ar:'عوّض بالقيم واستخدم ترتيب العمليات.',ans:String(v),sol:['Replace each variable with its value (in brackets).'].concat(s)};
};
GEN.l2_model=()=>{

  if(t===0){const w=rnd(2,4);const m=mcq('A team gets '+w+' points for a win, 1 point for a tie and 0 points for a loss. Let $w$ = wins, $t$ = ties, $z$ = losses. Which expression gives the team\'s points?','$'+w+'w + t$',['$w + t + z$','$'+w+'(w + t)$','$'+w+'w + t + z$'],['Points from wins: $'+w+'w$. From ties: $1t = t$. From losses: $0z = 0$.','Total: $'+w+'w + t$.']);m.ar='كل متغير × نقطه.';return m;}

GEN.l2_rw=()=>{
  const t=rnd(0,1);

};

/* Module 1 · Lesson 1-3 · Properties of Real Numbers (book p.23) */
(function(){
const {rnd,nz,pick,shuffle,mcq}=window.CG, GEN=window.GEN;
const EQ=['Reflexive Property','Symmetric Property','Transitive Property','Substitution Property'];

GEN.l3_eq=()=>{
  const t=rnd(0,2), a=rnd(5,40), b=rnd(5,40), v=pick(['x','y','m']), k=rnd(2,9);
  let st;
  if(t===0)st=pick(['$'+a+' + '+b+' = '+a+' + '+b+'$','$'+v+' + '+k+' = '+v+' + '+k+'$','$'+k+v+' - 1 = '+k+v+' - 1$']);
  else if(t===1)st='If $'+a+' + '+b+' = '+(a+b)+'$, then $'+(a+b)+' = '+a+' + '+b+'$.';
  else {const c=a+b-k;st='If $'+a+' + '+b+' = '+c+' + '+k+'$ and $'+c+' + '+k+' = '+(a+b)+'$, then $'+a+' + '+b+' = '+(a+b)+'$.';}
  const m=mcq('Which property of equality justifies the statement?<br>'+st,EQ[t],EQ.filter((_,i)=>i!==t),[['Reflexive: a quantity equals itself.','Symmetric: if a = b, then b = a (the sides swap).','Transitive: if a = b and b = c, then a = c (a chain).'][t]]);m.ar='انعكاسية، تماثل، تعدي.';return m;
};
GEN.l3_fill=()=>{
  const a=rnd(10,50),b=rnd(2,20),c=rnd(2,a),d=a+b-c, t=rnd(0,1);
  if(t===0){const m=mcq('If $'+a+' + '+b+' = '+c+' + '+d+'$ and $'+c+' + '+d+' = z$, then $'+a+' + '+b+' = $ ? (Transitive Property)','$z$',['$'+c+' + '+d+'$','$'+a+'$','$'+b+' + '+a+'$'],['Transitive: a chain a = b, b = c → a = c.','So $'+a+' + '+b+' = z$.']);m.ar='خاصية التعدي: سلسلة.';return m;}
  const v=pick(['y','m','p']),k=rnd(2,9),n=rnd(1,30);
  const m=mcq('$'+k+v+' - '+n+' = $ ? (Reflexive Property)','$'+k+v+' - '+n+'$',['$'+n+' - '+k+v+'$','$0$','$'+k+v+'$'],['Reflexive: any quantity equals itself.']);m.ar='الخاصية الانعكاسية: الشيء يساوي نفسه.';return m;
};
const NAMES=['Additive Identity','Additive Inverse','Multiplicative Identity','Multiplicative Inverse','Multiplicative Property of Zero','Commutative Property','Associative Property'];
GEN.l3_name=()=>{
  const a=rnd(2,15), p=rnd(2,9), q=rnd(2,9), t=rnd(0,6); let st;
  const pp=p===q?q+1:q;
  st=[ '$'+a+' + 0 = '+a+'$', '$'+a+' + (-'+a+') = 0$', '$1 * '+a+' = '+a+'$', '$\\frac{'+p+'}{'+pp+'} * \\frac{'+pp+'}{'+p+'} = 1$', '$'+a+' * 0 = 0$', '$'+a+' + '+p+' = '+p+' + '+a+'$', '$('+a+' + '+p+') + '+q+' = '+a+' + ('+p+' + '+q+')$'][t];
  const ds=shuffle(NAMES.filter((_,i)=>i!==t)).slice(0,3);
  const m=mcq('Name the property shown: '+st,NAMES[t],ds,[['Adding 0 keeps the number: additive identity.','A number plus its opposite is 0: additive inverse.','Multiplying by 1 keeps the number: multiplicative identity.','A number times its reciprocal is 1: multiplicative inverse.','Anything times 0 is 0.','Same numbers, order changed: commutative.','Same order, brackets moved: associative.'][t]]);m.ar='سمّ الخاصية.';return m;
};
GEN.l3_eval=()=>{
  const t=rnd(0,2);
  if(t===0){const p=rnd(2,9);let q=rnd(2,9);if(q===p)q++;const n=rnd(2,15);
    return {kind:'num',q:'Evaluate $\\frac{'+p+'}{'+q+'} * '+n+' * \\frac{'+q+'}{'+p+'}$.',ar:'استخدم الإبدال والمعكوس الضربي.',ans:String(n),sol:['Commutative: $\\frac{'+p+'}{'+q+'} * \\frac{'+q+'}{'+p+'} * '+n+'$.','Multiplicative inverses: $1 * '+n+'$.','Multiplicative identity: '+n+'.']};}
  if(t===1){const a=rnd(2,9),b=rnd(1,5),c=rnd(2,9),p=rnd(2,9),q=rnd(2,9);
    return {kind:'num',q:'Evaluate $['+(a*b+c)+' - '+a+'('+b+') + '+c+'] * 0 + \\frac{'+p+'}{'+q+'} * \\frac{'+q+'}{'+p+'}$.',ar:'أي حاجة × صفر = صفر.',ans:'1',sol:['Multiplicative Property of Zero: the bracket × 0 = 0.','Multiplicative inverses: $\\frac{'+p+'}{'+q+'} * \\frac{'+q+'}{'+p+'} = 1$.','$0 + 1 = 1$.']};}
  const k=rnd(2,6),s=k*k,b=rnd(2,9);
  return {kind:'num',q:'Evaluate $'+s+' - '+k+'^2 + '+b+'('+k+')$.',ar:'المعكوس الجمعي والمحايد.',ans:String(b*k),sol:['$'+k+'^2 = '+s+'$ and $'+b+'('+k+') = '+(b*k)+'$.','$'+s+' - '+s+' = 0$ (additive inverses).','$0 + '+(b*k)+' = '+(b*k)+'$ (additive identity).']};
};
GEN.l3_ca=()=>{
  const x=[rnd(10,40),0,rnd(10,40),0];x[1]=(Math.ceil(x[0]/10)*10+10)-x[0];x[3]=(Math.ceil(x[2]/10)*10+10)-x[2];
  const o=[x[0],x[2],x[1],x[3]],sum=x.reduce((a,b)=>a+b,0);
  return {kind:'num',q:'Use the Commutative and Associative Properties to find $'+o.join(' + ')+'$ mentally.',ar:'رتّب وجمّع الأعداد اللي مجموعها سهل.',ans:String(sum),sol:['Commutative: $'+x[0]+' + '+x[1]+' + '+x[2]+' + '+x[3]+'$.','Associative: $('+x[0]+' + '+x[1]+') + ('+x[2]+' + '+x[3]+') = '+(x[0]+x[1])+' + '+(x[2]+x[3])+'$.','= '+sum+'.']};
};

};

GEN.l4_left=()=>{
  const k=nz(-9,9), v=pick(['x','g','m','r']), p=nz(-9,9), q=nz(-9,9);

GEN.l4_like=()=>{
  const v=pick(['a','b','x','n']), t=rnd(0,1);
  if(t===0){const p=rnd(2,20),q=nz(-15,20);if(p+q===0)return GEN.l4_like();const ok='$'+F([[p+q,v]])+'$';

  const a=rnd(2,9),b=rnd(5,15),c=rnd(1,b-1);const ok='$'+F([[a,v+'^2'],[b-c,v]])+'$';

};

GEN.l5_sent=()=>{
  const a=rnd(2,9),b=rnd(5,30),c=rnd(2,9),t=rnd(0,3);let q,ok,ds;
  if(t===0){q=W(a)+' times a number less '+W(b)+' is equal to '+W(c+b);ok='$'+a+'x - '+b+' = '+(c+b)+'$';ds=['$'+a+'(x - '+b+') = '+(c+b)+'$','$'+b+' - '+a+'x = '+(c+b)+'$','$'+a+'x + '+b+' = '+(c+b)+'$'];}
  else if(t===1){q=W(b)+' minus the quotient of '+W(a)+' and x is the same as twice x';ok='$'+b+' - \\frac{'+a+'}{x} = 2x$';ds=['$'+b+' - \\frac{x}{'+a+'} = 2x$','$\\frac{'+b+' - '+a+'}{x} = 2x$','$'+b+' - '+a+'x = 2x$'];}
  else if(t===2){q='three times the quantity x plus '+W(a)+' equals '+W(b);ok='$3(x + '+a+') = '+b+'$';ds=['$3x + '+a+' = '+b+'$','$x + 3 * '+a+' = '+b+'$','$3x = '+a+' + '+b+'$'];}

  const m=mcq('Write an equation for the sentence: <i>'+q+'</i>.',ok,ds,['"is / equals / is the same as" → =.','Translate each side like an expression; "the quantity" or "the sum of" needs brackets only when the whole group is multiplied.']);m.ar='"is" = يساوي.';return m;
};
GEN.l5_model=()=>{

};
GEN.l5_formula=()=>{
  const t=rnd(0,2);

GEN.l5_toword=()=>{

  else if(t===1){e='(y + '+a+')^2 = '+c;ok='the quantity y plus '+W(a)+', squared, is '+c;ds=['y plus '+W(a)+' squared is '+c,'y squared plus '+W(a)+' is '+c,'y plus '+W(a)+' is '+c];}
  else {e=a+'(p + '+b+') = '+c;ok=W(a)+' times the sum of p and '+W(b)+' is '+c;ds=[W(a)+' times p plus '+W(b)+' equals '+c,'the quantity '+W(a)+' times p plus '+W(b)+' is '+c,W(a)+' plus p times '+W(b)+' is '+c];}
  const m=mcq('Which sentence represents $'+e+'$?',ok,ds,['Brackets → "the quantity" or "the sum / difference of", said <b>right after</b> the number that multiplies them.']);m.ar='القوس = "the quantity" بعد الرقم اللي بيضربه.';return m;
};

  const m=mcq('The surface area of a rectangular prism is $S = 2\\ell w + 2\\ell h + 2wh$. What does $2\\ell h$ represent?','the total area of the front and back faces',['the area of the top face only','the volume of the prism','the total area of the left and right faces'],['$\\ell h$ is the area of the front face; there are 2 such faces (front and back).','$2\\ell w$ = top + bottom, $2wh$ = left + right.']);m.ar='كل حد = مساحة وجهين متقابلين.';return m;
};

GEN.l6_add=()=>{
  const v=pick(['g','k','a','x','m']),x=nz(-40,150),b=rnd(5,60),t=rnd(0,1);

  const c=x+b;return {kind:'num',q:'Solve $'+b+' + '+v+' = '+c+'$.',ar:'اطرح '+b+' من الطرفين.',ans:String(x),sol:['Subtract '+b+' from each side (Subtraction Property of Equality).','$'+v+' = '+c+' - '+b+' = '+x+'$.']};
};
GEN.l6_mul=()=>{
  const v=pick(['x','y','p','n']),t=rnd(0,2);
  if(t===0){const a=nz(-15,15),x=nz(-12,12);if(Math.abs(a)===1)return GEN.l6_mul();return {kind:'num',q:'Solve $'+(a*x)+' = '+a+v+'$.',ar:'اقسم الطرفين على '+a+'.',ans:String(x),sol:['Divide each side by '+a+' (Division Property).','$'+v+' = \\frac{'+(a*x)+'}{'+a+'} = '+x+'$.']};}
  if(t===1){const d=rnd(2,9),x=nz(-10,10)*d;return {kind:'num',q:'Solve $\\frac{'+v+'}{'+d+'} = '+(x/d)+'$.',ar:'اضرب الطرفين في '+d+'.',ans:String(x),sol:['Multiply each side by '+d+' (Multiplication Property).','$'+v+' = '+(x/d)+' * '+d+' = '+x+'$.']};}
  let p,q;do{q=rnd(2,9);p=rnd(1,q-1);}while(window.CG.gcd(p,q)!==1);const k=nz(-6,6),x=q*k,r=p*k;
  return {kind:'num',q:'Solve $\\frac{'+p+'}{'+q+'}'+v+' = '+r+'$.',ar:'اضرب في المقلوب.',ans:String(x),sol:['Multiply each side by the reciprocal $\\frac{'+q+'}{'+p+'}$.','$'+v+' = '+r+' * \\frac{'+q+'}{'+p+'} = '+x+'$.']};

/* ===== 2-5 Absolute Value Equations ===== */
const set=(a,b)=>'$\\{'+Math.min(a,b)+', '+Math.max(a,b)+'\\}$';
GEN.l9_solve=()=>{
  const v=pick(['x','y','t']);let a=pick([1,1,2,3]),s1,s2,b,c;
  do{b=nz(-9,9);c=rnd(1,12);s1=(c-b)/a;s2=(-c-b)/a;}while(!Number.isInteger(s1)||!Number.isInteger(s2));
  const e='|'+lin(a,b,v)+'| = '+c, ok=set(s1,s2);
  const m=mcq('Solve $'+e+'$.',ok,[set(s1,-s2===s1?s1+1:-s2),'$\\{'+s1+'\\}$',set(-s1,-s2)],['Case 1: $'+lin(a,b,v)+' = '+c+'$ → $'+v+' = '+s1+'$.','Case 2: $'+lin(a,b,v)+' = -'+c+'$ → $'+v+' = '+s2+'$.']);m.ar='حالتين: = '+c+' و = −'+c+'.';return m;
};
GEN.l9_iso=()=>{
  const v=pick(['x','n']),k=rnd(2,5),b=nz(-8,8),c=rnd(1,10),add=nz(-9,9);
  const s1=c-b,s2=-c-b;
  const m=mcq('Solve $'+k+'|'+lin(1,b,v)+'|'+sgn(add)+' = '+(k*c+add)+'$.',set(s1,s2),[set(c+b,-c+b),'$\\{'+s1+'\\}$','$\\emptyset$'],['Isolate the absolute value first: $|'+lin(1,b,v)+'| = '+c+'$.','Two cases: $'+v+' = '+s1+'$ or $'+v+' = '+s2+'$.']);m.ar='اعزل القيمة المطلقة الأول.';return m;
};
GEN.l9_empty=()=>{
  const v=pick(['x','m']),a=rnd(2,6),b=nz(-9,9),c=rnd(1,9);
  const m=mcq('Solve $|'+lin(a,b,v)+'| = -'+c+'$.','$\\emptyset$ (no solution)',['$\\{'+((-c-b)/a).toFixed(0)+'\\}$','$\\{-'+c+', '+c+'\\}$','all real numbers'],['An absolute value is a distance, so it can never be negative.','No solution: ∅.']);m.ar='القيمة المطلقة مستحيل تكون سالبة.';return m;
};
GEN.l9_write=()=>{
  const t=rnd(0,1);
  if(t===0){let lo,d,hi,mid;do{lo=nz(-10,10);d=rnd(1,6);hi=lo+2*d;mid=lo+d;}while(mid===0);const m=mcq('A number line shows only the points '+lo+' and '+hi+'. Which equation does it represent?','$|x'+sgn(-mid)+'| = '+d+'$',['$|x'+sgn(mid)+'| = '+d+'$','$|x'+sgn(-mid)+'| = '+(2*d)+'$','$|x'+sgn(-lo)+'| = '+hi+'$'],['Midpoint: $\\frac{'+lo+' + '+hi+'}{2} = '+mid+'$.','Distance from the midpoint: '+d+'.']);m.ar='المنتصف والمسافة.';return m;}
  const avg=pick([2000,500,60,360,180]),e=Math.round(avg/pick([8,10,12]));
  const m=mcq('A value is on average '+avg+', give or take '+e+'. Write and solve an equation for the maximum and minimum.','$|x - '+avg+'| = '+e+'$; '+(avg-e)+' and '+(avg+e),['$|x + '+avg+'| = '+e+'$; '+(avg-e)+' and '+(avg+e),'$|x - '+e+'| = '+avg+'$; '+(avg-e)+' and '+(avg+e),'$|x - '+avg+'| = '+e+'$; '+avg+' only'],['The difference from the average is '+e+': $|x - '+avg+'| = '+e+'$.','$x = '+(avg+e)+'$ or $x = '+(avg-e)+'$.']);m.ar='الفرق عن المتوسط = المسموح.';return m;
};

GEN.l11_lit=()=>{
  const t=rnd(0,2), a=rnd(2,9), b=rnd(2,9), c=rnd(5,30);
  if(t===0){const m=mcq('Solve $'+a+'a - '+b+'b = '+c+'$ for $a$.','$a = \\frac{'+c+' + '+b+'b}{'+a+'}$',['$a = \\frac{'+c+' - '+b+'b}{'+a+'}$','$a = '+c+' + '+b+'b - '+a+'$','$a = \\frac{'+a+'}{'+c+' + '+b+'b}$'],['Add $'+b+'b$ to each side.','Divide everything by '+a+'.']);m.ar='اعزل المتغير المطلوب.';return m;}
  if(t===1){const m=mcq('Solve $'+a+'p - '+b+'r = pq + '+c+'$ for $p$.','$p = \\frac{'+c+' + '+b+'r}{'+a+' - q}$',['$p = \\frac{'+c+' + '+b+'r}{'+a+' + q}$','$p = \\frac{'+c+' - '+b+'r}{'+a+' - q}$','$p = \\frac{'+c+' + '+b+'r - q}{'+a+'}$'],['Get all $p$ terms on one side: $'+a+'p - pq = '+c+' + '+b+'r$.','Factor: $p('+a+' - q) = '+c+' + '+b+'r$, then divide.']);m.ar='جمّع p وطلّعها عامل مشترك.';return m;}
  const m=mcq('Solve $A = \\frac{h(b_1 + b_2)}{2}$ for $h$.','$h = \\frac{2A}{b_1 + b_2}$',['$h = \\frac{2A}{b_1} + b_2$','$h = \\frac{A}{2(b_1 + b_2)}$','$h = 2A - (b_1 + b_2)$'],['Multiply by 2: $2A = h(b_1 + b_2)$.','Divide by the whole bracket $(b_1 + b_2)$.']);m.ar='اقسم على القوس كله.';return m;

};

const {rnd,nz,pick,shuffle,mcq,gcd,graph}=window.CG, GEN=window.GEN, F=window.CF;
const sgn=n=>n<0?' - '+(-n):' + '+n;
/* reduced fraction: {s:'3/4' for answers, t:'\\frac{3}{4}' for display} */
const fr=(n,d)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d);n/=g;d/=g;return d===1?{s:String(n),t:String(n)}:{s:n+'/'+d,t:(n<0?'-':'')+'\\frac{'+Math.abs(n)+'}{'+d+'}'};};
window.CFR=fr;
const fig=o=>'<div class="fig">'+graph(o)+'</div>';
window.CFIG=fig;
/* y = m x + b with m = p/q as text */
const lineT=(p,q,b,v)=>{v=v||'x';const m=fr(p,q);let s=m.s==='0'?'':(m.s==='1'?v:m.s==='-1'?'-'+v:m.t+v);if(b||!s)s+=s?sgn(b):String(b);return s;};
window.CLT=lineT;

/* ===== 4-1 Graphing Linear Functions ===== */
GEN.l12_table=()=>{
  const m=nz(-4,4),b=nz(-6,6),x=nz(-5,5);
  return {kind:'num',q:'In the table for $y = '+lineT(m,1,b)+'$, what is $y$ when $x = '+x+'$?',ar:'عوّض بقيمة x.',ans:String(m*x+b),sol:['$y = '+m+'('+x+')'+sgn(b)+'$','$y = '+(m*x)+sgn(b)+' = '+(m*x+b)+'$'],fig:fig({fns:[{f:t=>m*t+b}],pts:[[x,m*x+b]],xr:[-8,8],yr:[-12,12],step:1,ystep:2,size:240})};
};
GEN.l12_int=()=>{
  let a,b,c;do{a=nz(-6,6);b=nz(-6,6);c=a*b*nz(-3,3);}while(c%a||c%b);
  const xi=c/a,yi=c/b;
  const eq=F([[a,'x'],[b,'y']])+' = '+c;
  const m=mcq('Find the intercepts of $'+eq+'$.','$x$-intercept '+xi+', $y$-intercept '+yi,['$x$-intercept '+yi+', $y$-intercept '+xi,'$x$-intercept '+(-xi)+', $y$-intercept '+yi,'$x$-intercept '+xi+', $y$-intercept '+(-yi)],['$x$-intercept: let $y = 0$ → $'+a+'x = '+c+'$ → $x = '+xi+'$.','$y$-intercept: let $x = 0$ → $'+b+'y = '+c+'$ → $y = '+yi+'$.']);m.ar='x-intercept: y = 0، و y-intercept: x = 0.';return m;
};
GEN.l12_hv=()=>{
  const a=nz(-6,6),t=rnd(0,1);
  if(t===0){const m=mcq('Which describes the graph of $y = '+a+'$?','a horizontal line through $(0, '+a+')$',['a vertical line through $('+a+', 0)$','a line through the origin with slope '+a,'a single point $('+a+', '+a+')$'],['$y = '+a+'$ is $y = 0x '+sgn(a)+'$: every point has $y = '+a+'$.']);m.ar='y = رقم: خط أفقي.';return m;}
  const m=mcq('Which describes the graph of $x = '+a+'$?','a vertical line through $('+a+', 0)$',['a horizontal line through $(0, '+a+')$','a line through the origin with slope '+a,'it is a function with slope 0'],['Every point has $x = '+a+'$, so the line is vertical.','It is not a function.']);m.ar='x = رقم: خط رأسي، مش دالة.';return m;
};
GEN.l12_ctx=()=>{
  const q=pick([2,3,5]),p=rnd(1,q*2),k=rnd(4,12),tot=p*k;if(gcd(p,q)!==1)return GEN.l12_ctx();   /* y + (p/q)x = tot with x-int = tot*q/p */
  const xi=tot*q/p; if(!Number.isInteger(xi))return GEN.l12_ctx();
  return {kind:'num',q:'A bag has '+tot+' cups of food. The dog eats $\\frac{'+p+'}{'+q+'}$ cups a day, so $y + \\frac{'+p+'}{'+q+'}x = '+tot+'$. Find the $x$-intercept. What does it mean?',ar:'x-intercept = اليوم اللي الأكل يخلص فيه.',ans:String(xi),sol:['Let $y = 0$: $\\frac{'+p+'}{'+q+'}x = '+tot+'$.','$x = '+tot+' * \\frac{'+q+'}{'+p+'} = '+xi+'$.','After '+xi+' days the bag is empty. ($y$-intercept '+tot+' = full bag on day 0.)']};
};

/* ===== 4-2 Rate of Change and Slope ===== */
GEN.l13_rate=()=>{
  const m=nz(-6,9),b=rnd(0,20),x0=rnd(1,4),dx=rnd(1,3);
  const xs=[x0,x0+dx,x0+2*dx],ys=xs.map(x=>m*x+b);
  return {kind:'num',q:'Find the rate of change.<div class="tbl"><table><tr><th>x</th>'+xs.map(x=>'<td>'+x+'</td>').join('')+'</tr><tr><th>y</th>'+ys.map(y=>'<td>'+y+'</td>').join('')+'</tr></table></div>',ar:'التغير في y ÷ التغير في x.',ans:String(m),sol:['$\\frac{'+ys[1]+' - '+ys[0]+'}{'+xs[1]+' - '+xs[0]+'} = \\frac{'+(ys[1]-ys[0])+'}{'+dx+'} = '+m+'$']};
};
GEN.l13_slope=()=>{
  let x1,y1,x2,y2;do{x1=rnd(-8,8);y1=rnd(-8,8);x2=rnd(-8,8);y2=rnd(-8,8);}while(x1===x2);
  const s=fr(y2-y1,x2-x1);
  return {kind:'num',q:'Find the slope of the line through $('+x1+', '+y1+')$ and $('+x2+', '+y2+')$.',ar:'m = (y₂ − y₁) ÷ (x₂ − x₁)',ans:s.s,sol:['$m = \\frac{'+y2+' - ('+y1+')}{'+x2+' - ('+x1+')} = \\frac{'+(y2-y1)+'}{'+(x2-x1)+'}$','$m = '+s.t+'$']};
};
GEN.l13_kind=()=>{
  const t=rnd(0,3),a=nz(-7,7),b=rnd(-7,7);let q,ok;
  if(t===0){q='$('+a+', '+b+')$ and $('+a+', '+(b+rnd(2,6))+')$';ok='undefined (vertical line)';}
  else if(t===1){q='$('+b+', '+a+')$ and $('+(b+rnd(2,6))+', '+a+')$';ok='0 (horizontal line)';}
  else if(t===2){const d=rnd(1,5);q='$('+b+', '+a+')$ and $('+(b+d)+', '+(a+d*rnd(1,3))+')$';ok='positive';}
  else {const d=rnd(1,5);q='$('+b+', '+a+')$ and $('+(b+d)+', '+(a-d*rnd(1,3))+')$';ok='negative';}
  const m=mcq('What kind of slope does the line through '+q+' have?',ok,['positive','negative','0 (horizontal line)','undefined (vertical line)'],['Same x → vertical → undefined. Same y → horizontal → 0.','Up to the right → positive; down → negative.']);m.ar='نفس x غير معرف، نفس y صفر.';return m;
};
GEN.l13_lin=()=>{
  const lin=Math.random()<.5,x0=rnd(1,20),dx=rnd(2,7);const xs=[0,1,2,3].map(i=>x0+i*dx);let ys;
  if(lin){const m=nz(-3,3);ys=xs.map(x=>m*x);}else{ys=[rnd(-5,5)];[1,2,3].forEach(i=>ys.push(ys[i-1]+[1,3,2][i-1]*pick([1,-1])));}
  const m=mcq('Is the function linear?<div class="tbl"><table><tr><th>x</th>'+xs.map(x=>'<td>'+x+'</td>').join('')+'</tr><tr><th>y</th>'+ys.map(y=>'<td>'+y+'</td>').join('')+'</tr></table></div>',lin?'Yes, the rate of change is constant':'No, the rate of change is not constant',[lin?'No, the rate of change is not constant':'Yes, the rate of change is constant','Yes, because x increases by the same amount','No, because y is negative'],['Find $\\frac{change in y}{change in x}$ between each pair.',lin?'All rates are equal → linear.':'The rates are different → not linear.']);m.ar='معدل ثابت = خطية.';return m;
};

/* ===== 4-3 Slope-Intercept Form ===== */
GEN.l14_write=()=>{
  let p=nz(-7,7),q=pick([1,1,2,3,4,5,7]);if(gcd(p,q)!==1)q=1;const b=nz(-12,12);
  const ok='$y = '+lineT(p,q,b)+'$';

};
GEN.l14_rew=()=>{

  const m=mcq('Write $'+F([[a,'x'],[bb,'y']])+' = '+c+'$ in slope-intercept form.',ok,['$y = '+lineT(a,bb,c/bb)+'$','$y = '+lineT(-a,1,c)+'$','$y = '+lineT(-a,bb,-c/bb)+'$'],['Move the x-term: $'+F([[bb,'y']])+' = '+F([[-a,'x'],[c,'']])+'$.','Divide every term by '+bb+'.']);m.ar='اعزل y واقسم كل الحدود.';return m;
};
GEN.l14_ctx=()=>{
  const s=rnd(50,300),r=rnd(2,15);

};
GEN.l14_graph=()=>{
  const m=nz(-3,3),b=nz(-4,4);

};

/* ===== 4-4 Transformations of Linear Functions ===== */
GEN.l15_tr=()=>{
  const t=rnd(0,2),k=nz(-9,9),h=nz(-9,9);
  if(t===0){const m=mcq('Describe $g(x) = x'+sgn(k)+'$ compared with $f(x) = x$.','translated '+Math.abs(k)+' units '+(k>0?'up':'down'),['translated '+Math.abs(k)+' units '+(k>0?'down':'up'),'translated '+Math.abs(k)+' units '+(k>0?'left':'right'),'stretched vertically by '+Math.abs(k)],['k is outside (added to the output) → vertical.',(k>0?'k > 0 → up.':'k < 0 → down.')]);m.ar='k برّه: فوق/تحت.';return m;}
  if(t===1){const m=mcq('Describe $g(x) = (x'+sgn(h)+')$ compared with $f(x) = x$.','translated '+Math.abs(h)+' units '+(h>0?'left':'right'),['translated '+Math.abs(h)+' units '+(h>0?'right':'left'),'translated '+Math.abs(h)+' units '+(h>0?'up':'down'),'reflected across the x-axis'],['$g(x) = f(x - h)$ with $h = '+(-h)+'$.',(h>0?'$x + '+h+'$ → left.':'$x - '+(-h)+'$ → right.')]);m.ar='جوه القوس: عكس الإشارة.';return m;}
  const ok='translated '+Math.abs(h)+' units '+(h>0?'right':'left')+' and '+Math.abs(k)+' units '+(k>0?'up':'down');
  const m=mcq('Describe $g(x) = (x'+sgn(-h)+')'+sgn(k)+'$ compared with $f(x) = x$.',ok,['translated '+Math.abs(h)+' units '+(h>0?'left':'right')+' and '+Math.abs(k)+' units '+(k>0?'up':'down'),'translated '+Math.abs(k)+' units '+(k>0?'right':'left')+' and '+Math.abs(h)+' units '+(h>0?'up':'down'),'translated '+Math.abs(h)+' units '+(h>0?'right':'left')+' and '+Math.abs(k)+' units '+(k>0?'down':'up')],['Inside the bracket → horizontal (opposite sign).','Outside → vertical.']);m.ar='جوه أفقي بعكس الإشارة، برّه رأسي.';return m;
};
GEN.l15_dil=()=>{
  const t=rnd(0,1),big=Math.random()<.5;const a=big?rnd(2,8):pick(['\\frac{1}{2}','\\frac{1}{3}','\\frac{1}{4}','\\frac{2}{5}']);
  if(t===0){const ok=big?'vertical stretch (steeper)':'vertical compression (less steep)';const m=mcq('Describe $g(x) = '+a+'x$ written as $g(x) = '+a+' * f(x)$, where $f(x) = x$.',ok,[big?'vertical compression (less steep)':'vertical stretch (steeper)','translation '+(big?a:'')+' units up','reflection across the y-axis'],['a multiplies the output: |a| '+(big?'> 1 → stretch':'< 1 → compression')+'.']);m.ar='|a| > 1 تمدد، أقل من 1 انضغاط.';return m;}
  const ok=big?'horizontal compression (steeper)':'horizontal stretch (less steep)';
  const m=mcq('Describe $g(x) = f('+a+'x)$, where $f(x) = x$.',ok,[big?'horizontal stretch (less steep)':'horizontal compression (steeper)','vertical stretch','translation left'],['a multiplies the input: |a| '+(big?'> 1 → horizontal compression':'< 1 → horizontal stretch')+'.']);m.ar='جوه: |a| > 1 انضغاط أفقي.';return m;
};
GEN.l15_ref=()=>{
  const a=rnd(2,6),t=rnd(0,1);
  if(t===0){const m=mcq('Describe $g(x) = -'+a+'x$ compared with $f(x) = x$.','reflected across the x-axis and stretched vertically by '+a,['reflected across the y-axis only','translated '+a+' units down','compressed vertically by '+a],['The negative sign outside → reflection across the x-axis.','|−'+a+'| > 1 → stretch.']);m.ar='سالب برّه: انعكاس حول x.';return m;}
  const m=mcq('Describe $g(x) = f(-x)$ where $f(x) = x + '+a+'$.','reflected across the y-axis',['reflected across the x-axis','translated '+a+' units left','no change'],['The negative is on the input → reflection across the y-axis.']);m.ar='سالب جوه: انعكاس حول y.';return m;
};
GEN.l15_ctx=()=>{
  const p=rnd(5,20),fee=rnd(2,9);const t=rnd(0,1);
  const m=mcq('Tickets cost $f(t) = '+p+'t$. '+(t?'A coupon takes AED '+fee+' off: $g(t) = '+p+'t - '+fee+'$.':'A service fee of AED '+fee+' is added: $g(t) = '+p+'t + '+fee+'$.')+' Describe $g$ compared with $f$.','translated '+fee+' units '+(t?'down':'up'),['translated '+fee+' units '+(t?'up':'down'),'translated '+fee+' units '+(t?'right':'left'),'stretched by '+fee],['The fee is added after the price is found → vertical translation.']);m.ar='الرسوم بعد الحساب ← رأسي.';return m;
};

const avT=(a,h,k)=>{const A=a===1?'':a===-1?'-':a;const inside=h===0?'x':'x'+sgn(-h);return A+'|'+inside+'|'+(k?sgn(k):'');};

  const h=nz(-6,6),k=nz(-6,6),t=rnd(0,2);

  if(t===1){const m=mcq('Describe $g(x) = |x'+sgn(-h)+'|$ compared with $f(x) = |x|$.','translated '+Math.abs(h)+' units '+(h>0?'right':'left'),['translated '+Math.abs(h)+' units '+(h>0?'left':'right'),'translated '+Math.abs(h)+' units '+(h>0?'up':'down'),'reflected across the x-axis'],['$|x - h|$ with $h = '+h+'$ → '+(h>0?'right.':'left.')]);m.ar='جوه: بعكس الإشارة.';return m;}
  const m=mcq('What is the vertex of $g(x) = '+avT(1,h,k)+'$?','$('+h+', '+k+')$',['$('+(-h)+', '+k+')$','$('+k+', '+h+')$','$('+h+', '+(-k)+')$'],['$g(x) = |x - h| + k$ has vertex $(h, k)$.','Here $h = '+h+'$, $k = '+k+'$.']);m.ar='الرأس (h, k).';return m;
};
GEN.l18_graph=()=>{
  const h=nz(-4,4),k=nz(-4,4),a=pick([1,1,-1]);
  const q=mcq('Which equation matches the graph?','$g(x) = '+avT(a,h,k)+'$',['$g(x) = '+avT(a,-h,k)+'$','$g(x) = '+avT(a,h,-k)+'$','$g(x) = '+avT(-a,h,k)+'$'],['Vertex $('+h+', '+k+')$ → $|x'+sgn(-h)+'|'+sgn(k)+'$.',a<0?'Opens down → negative sign in front.':'Opens up → positive.']);
  q.fig=fig({fns:[{f:x=>a*Math.abs(x-h)+k}],pts:[[h,k]],xr:[-8,8],yr:[-8,8],size:220});q.ar='اقرأ الرأس واتجاه الفتحة.';return q;
};
GEN.l18_dil=()=>{
  const t=rnd(0,3);const big=rnd(2,6),sm=pick(['\\frac{1}{2}','\\frac{1}{3}','\\frac{2}{5}','\\frac{3}{4}']);
  const opts=['vertical stretch','vertical compression','horizontal compression','horizontal stretch'];
  const e=['$'+big+'|x|$','$'+sm+'|x|$','$|'+big+'x|$','$|'+sm+'x|$'][t];
  const m=mcq('Which describes $g(x) = '+e.slice(1,-1)+'$ compared with $f(x) = |x|$?',opts[t],opts.filter((_,i)=>i!==t),['a outside: |a| > 1 vertical stretch, < 1 vertical compression.','a inside: |a| > 1 horizontal compression, < 1 horizontal stretch.']);m.ar='برّه رأسي، جوه أفقي بالعكس.';return m;
};
GEN.l18_eval=()=>{
  const a=pick([1,2,3,-1,-2]),h=nz(-5,5),k=nz(-6,6),x=nz(-6,6);

};

/* ---------- exam center ---------- */
function genKeys(id,ti){const l=L[id];const ks=[];l.types.forEach((t,i)=>{if(ti!=null&&i!==ti)return;(t.gen||[]).forEach(k=>{if(GEN[k]&&!ks.includes(k))ks.push(k);});});return ks;}
function genFor(id,n,ti){
  const keys=genKeys(id,ti); const out=[]; if(!keys.length)return out;
  const start=G.rnd(0,keys.length-1);
  for(let i=0;i<n;i++){const k=keys[(start+i)%keys.length];try{const q=GEN[k]();q.src=q.src||'Practice';q.lid=id;out.push(q);}catch(e){}}
  return G.shuffle(out);
}
function prep(q,lid){
  q=Object.assign({lid},q);
  if((q.kind||'mcq')!=='mcq'&&q.kind!=='multi')return q;
  const idx=G.shuffle(q.o.map((_,i)=>i));
  return Object.assign(q,{o:idx.map(i=>q.o[i]),a:q.a.map(a=>idx.indexOf(a))});
}
function quickSet(id,n){
  const l=L[id]; const fx=G.shuffle(l.exam.filter(q=>q.kind!=='frq')).slice(0,Math.ceil(n*.4)).map(q=>prep(q,id));
  return G.shuffle(fx.concat(genFor(id,n-fx.length)));
}

/* ---------- question card ---------- */
function solHTML(sol){ if(!sol)return ''; if(Array.isArray(sol))return '<ol>'+sol.map(s=>'<li>'+T(s)+'</li>').join('')+'</ol>'; return '<div>'+T(sol)+'</div>'; }
function card(q,num,done){
  const d=document.createElement('div'); d.className='eq';
  const kind=q.kind||'mcq';
  const tags='<div class="meta"><span class="tagq">Q'+num+'</span>'+(q.src?'<span class="tagq src">'+esc(q.src)+'</span>':'')+(kind==='frq'?'<span class="tagq frq">Written</span>':'')+(kind==='multi'?'<span class="tagq">Select all</span>':'')+(kind==='tf'?'<span class="tagq">True or false</span>':'')+'</div>';
  let body='<div class="qt">'+T(q.q)+(q.ar?'<span class="ar">'+q.ar+'</span>':'')+'</div>'+(q.fig||'');
  if(kind==='mcq'||kind==='multi'||kind==='tf'){
    const o=kind==='tf'?['True','False']:q.o;
    body+='<div class="opts'+(kind==='tf'?' tf':'')+'">'+o.map((x,j)=>'<button class="opt'+(kind==='multi'?' multi':'')+'">'+(kind==='tf'?'':'<span class="l">'+'ABCDEF'[j]+'</span>')+'<span>'+T(x)+'</span></button>').join('')+'</div>'+(kind==='multi'?'<button class="btn" data-ck hidden style="margin-top:10px">Check</button>':'');
  } else if(kind==='num'){
    body+='<div class="numrow"><input type="text" autocomplete="off" aria-label="Your answer" placeholder="Your answer"><button class="btn" data-ck>Check</button></div>';
  } else if(kind==='frq'){
    body+='<p style="margin:10px 0 0;color:var(--soft);font-size:14px">Solve it on paper. Then compare with the model answer.</p><button class="btn" data-model style="margin-top:10px">Show model answer</button>';
  }
  d.innerHTML=tags+body+'<div class="efb" hidden></div>';
  const fb=d.querySelector('.efb');
  let fin=false;
  const finish=(ok,txt)=>{ if(fin)return; fin=true;
    fb.hidden=false; fb.className='efb '+(ok?'ok':'no');
    fb.innerHTML='<span class="v">'+(ok?'Correct':'Not quite')+'</span>'+(txt||'')+solHTML(q.sol);
    done&&done(ok);
  };
  if(kind==='mcq'||kind==='tf'||kind==='multi'){
    const opts=[...d.querySelectorAll('.opt')], ans=kind==='tf'?[q.a?0:1]:q.a, ck=d.querySelector('[data-ck]');
    const grade=picked=>{const ok=picked.length===ans.length&&picked.every(p=>ans.includes(p));
      opts.forEach((o,j)=>{o.disabled=true;o.classList.remove('sel');if(ans.includes(j))o.classList.add('right');else if(picked.includes(j))o.classList.add('wrong');});
      if(ck)ck.hidden=true; finish(ok);};
    opts.forEach((o,j)=>o.addEventListener('click',()=>{ if(fin)return;
      if(kind==='multi'){o.classList.toggle('sel');ck.hidden=!opts.some(x=>x.classList.contains('sel'));} else grade([j]);}));
    if(ck)ck.addEventListener('click',()=>grade(opts.map((o,j)=>o.classList.contains('sel')?j:-1).filter(j=>j>=0)));
  } else if(kind==='num'){
    const inp=d.querySelector('input'), ck=d.querySelector('[data-ck]');
    const norm=s=>String(s).toLowerCase().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/\*/g,'').replace(/^[a-z]=/,'');
    const go=()=>{ if(fin||!inp.value.trim())return;
      const v=norm(inp.value); const answers=(Array.isArray(q.ans)?q.ans:[q.ans]).map(norm);
      let ok=answers.includes(v);
      const num=s=>{if(/^[-+]?\d*\.?\d+$/.test(s))return parseFloat(s);const m=s.match(/^([-+]?\d+)\/(\d+)$/);return m?(+m[1])/(+m[2]):NaN;};
      if(!ok){const n=num(v);if(!isNaN(n))ok=answers.some(a=>!isNaN(num(a))&&Math.abs(num(a)-n)<1e-6);}
      inp.classList.add(ok?'right':'wrong'); inp.disabled=true; ck.hidden=true;
      finish(ok, ok?'':'<div>Answer: <b>'+T('$'+(Array.isArray(q.ans)?q.ans[0]:q.ans)+'$')+'</b></div>');};
    ck.addEventListener('click',go); inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  } else if(kind==='frq'){
    const b=d.querySelector('[data-model]');
    b.addEventListener('click',()=>{b.hidden=true;fb.hidden=false;fb.className='efb info';
      fb.innerHTML='<span class="v">Model answer</span>'+solHTML(q.sol)+'<div class="selfmark"><button class="btn" data-y>I got it right</button><button class="btn ghost" data-n>I made a mistake</button></div>';
      fb.querySelector('[data-y]').addEventListener('click',()=>{fb.querySelector('.selfmark').remove();fb.className='efb ok';done&&done(true);});
      fb.querySelector('[data-n]').addEventListener('click',()=>{fb.querySelector('.selfmark').remove();fb.className='efb no';done&&done(false);});
    });
  }
  return d;
}

/* ---------- runner ---------- */
let TIMER=null;
function run(cfg){
  clearInterval(TIMER);
  let i=0, right=0, total=0, left=cfg.timer||0;
  const wrong=[];
  const next=()=>{
    let q;
    if(cfg.endless){q=cfg.endless(); if(!q){app.innerHTML='<div class="empty">No questions yet.</div>';return;}}
    else{ if(i>=cfg.qs.length)return result(); q=cfg.qs[i]; }
    i++;
    const n=cfg.endless?total+1:i;
    app.innerHTML='<section class="view"><div class="rtop"><span>'+(cfg.endless?right+' / '+total+' correct':i+' / '+cfg.qs.length)+'</span><div class="rbar"><span style="width:'+(cfg.endless?0:Math.round(100*(i-1)/cfg.qs.length))+'%"></span></div>'+(cfg.timer?'<span class="timer" id="tm"></span>':'')+'</div><div class="runtitle">'+esc(cfg.title)+'</div><div id="qslot"></div><div class="ractions"><button class="btn" id="nx" hidden>'+(cfg.endless||i<cfg.qs.length?'Next question ›':'See my result')+'</button>'+(cfg.endless?'<button class="btn ghost" id="stop">Finish</button>':'')+'</div></section>';
    tick();
    $('#qslot').appendChild(card(q,n,ok=>{total++;if(ok)right++;else wrong.push(q);record(q.lid||cfg.lid,ok,q);$('#nx').hidden=false;$('#nx').focus({preventScroll:true});}));
    $('#nx').addEventListener('click',next);
    const st=$('#stop'); if(st)st.addEventListener('click',result);
    window.scrollTo(0,0);
  };
  const tick=()=>{const t=$('#tm');if(!t)return;const m=Math.floor(left/60),s=left%60;t.textContent=m+':'+String(s).padStart(2,'0');t.classList.toggle('low',left<120);};
  if(cfg.timer){TIMER=setInterval(()=>{left--;tick();if(left<=0){clearInterval(TIMER);result(true);}},1000);}
  const result=(timeUp)=>{
    clearInterval(TIMER);
    const p=total?Math.round(100*right/total):0;
    const verdict=(timeUp?'Time is up. ':'')+(p>=90?'Full-mark level. Keep it up.':p>=70?'Good. Fix your mistakes and try again.':'Go back to the lesson and the solved examples, then try again.');
    app.innerHTML='<section class="view"><div class="score"><div class="big">'+right+'<small>/'+total+'</small></div><div class="verdict">'+verdict+'</div></div>'+
    '<div class="rcard"><div class="lg">Catalyst<i>.</i><small>by Mrs. Rana</small></div><div class="who">'+esc(DB.name||'Student')+'</div><div class="what">'+esc(cfg.title)+' · Grade 9 Math</div><div class="num"><b>'+p+'%</b><span>'+right+' of '+total+' correct</span></div><div class="meta2"><span>'+new Date().toLocaleDateString('en-GB')+'</span><span>Less effort. Full marks.</span></div></div>'+
    '<div class="ractions"><button class="btn" id="again">Try again</button>'+(wrong.length?'<a class="btn ghost" href="#'+(cfg.lid?cfg.lid+'-mist':'mistakes')+'">Fix my mistakes</a>':'')+'<a class="btn ghost" href="#'+(cfg.lid||'')+'">Back</a></div></section>';
    $('#again').addEventListener('click',()=>{ if(cfg.lid&&!cfg.fromMist)examView(cfg.lid); else route(); });
    window.scrollTo(0,0);
  };
  next();
}

/* ---------- router ---------- */
function route(){
  clearInterval(TIMER);
  const h=location.hash.slice(1);
  document.body.classList.remove('test');
  let m;
  if(!h)home();
  else if(h==='how')how();
  else if(h==='mistakes')mistakes();
  else if((m=h.match(/^unit(\d)$/)))unitTest(+m[1]);
  else if((m=h.match(/^(l\d+)-(\w+)$/))&&L[m[1]]){const id=m[1],v=m[2];
    if(v==='learn')learn(id); else if(v==='map')mapView(id); else if(v==='cards')cardsView(id); else if(v==='traps')trapsView(id);
    else if(v==='exam')examView(id); else if(v==='mist')mistakes(id);
    else if(v==='quick'){chrome(true,false);run({title:'Quick test · '+L[id].title,lid:id,qs:quickSet(id,10)});}
    else lessonHome(id);}
  else if(L[h])lessonHome(h);
  else home();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
